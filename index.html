<!DOCTYPE html>
<html>
<head>
    <title>1v1 Web Duel</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { background: #000; border: 2px solid #444; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #status { margin-bottom: 10px; font-size: 20px; color: #00ffcc; }
    </style>
</head>
<body>
    <div id="status">Connecting to server...</div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');

        let myRoom = null;
        let myRole = null; // 'p1' or 'p2'
        let gameActive = false;

        const player = { x: 50, y: 200, color: '#00d4ff', size: 30 };
        const opponent = { x: 720, y: 200, color: '#ff4b2b', size: 30 };

        socket.on('waiting', (msg) => { statusDiv.innerText = msg; });

        socket.on('startGame', (data) => {
            myRoom = data.room;
            myRole = socket.id === data.p1 ? 'p1' : 'p2';
            statusDiv.innerText = "Match Found! Move: WASD | Shoot: Space";
            gameActive = true;
            
            // Set starting positions
            if (myRole === 'p2') {
                player.x = 720;
                opponent.x = 50;
                player.color = '#ff4b2b';
                opponent.color = '#00d4ff';
            }
            loop();
        });

        // Input Handling
        const keys = {};
        window.onkeydown = (e) => { keys[e.key.toLowerCase()] = true; };
        window.onkeyup = (e) => { keys[e.key.toLowerCase()] = false; };

        function update() {
            if (!gameActive) return;

            let moved = false;
            if (keys['w'] && player.y > 0) { player.y -= 5; moved = true; }
            if (keys['s'] && player.y < canvas.height - player.size) { player.y += 5; moved = true; }

            if (moved) {
                socket.emit('updateAction', { room: myRoom, y: player.y });
            }
        }

        socket.on('opponentUpdate', (data) => {
            opponent.y = data.y;
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.size, player.size);

            // Draw Opponent
            ctx.fillStyle = opponent.color;
            ctx.fillRect(opponent.x, opponent.y, opponent.size, opponent.size);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
